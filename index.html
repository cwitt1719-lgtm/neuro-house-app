<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0614" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Neuro-House</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="puzzles" aria-hidden="true">
    <svg class="p1" viewBox="0 0 100 100"><use href="#piece"/></svg>
    <svg class="p2" viewBox="0 0 100 100"><use href="#piece"/></svg>
    <svg class="p3" viewBox="0 0 100 100"><use href="#piece"/></svg>
    <svg class="p4" viewBox="0 0 100 100"><use href="#piece"/></svg>
    <svg class="p5" viewBox="0 0 100 100"><use href="#piece"/></svg>
    <svg class="p6" viewBox="0 0 100 100"><use href="#piece"/></svg>
  </div>
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <path id="piece" d="M22 8h22c0 10 16 10 16 0h22v22c-10 0-10 16 0 16v22H60c0-10-16-10-16 0H22V46c10 0 10-16 0-16z"/>
    </defs>
  </svg>
  <main class="app">
    <header class="top">
      <svg class="logo" viewBox="0 0 96 96" aria-hidden="true">
        <rect width="96" height="96" rx="24" fill="#160c28"/>
        <g transform="translate(6 8) scale(.84)"><use href="#piece" fill="#22d3ee"/></g>
        <g transform="translate(28 4) scale(.5)"><use href="#piece" fill="#facc15"/></g>
        <g transform="translate(8 40) scale(.48)"><use href="#piece" fill="#f472b6"/></g>
        <g transform="translate(42 38) scale(.52)"><use href="#piece" fill="#34d399"/></g>
      </svg>
      <div class="brand">
        <h1>Neuro-House</h1>
        <p>Household binder. Stays on this phone.</p>
      </div>
    </header>
    <section id="home" class="screen on">
      <div class="toolbar">
        <button class="btn btn-qr" id="makeQr">Guest QR card</button>
        <button class="btn btn-ghost" id="exportBtn">Backup</button>
        <button class="btn btn-ghost" id="importBtn">Restore</button>
      </div>
      <div class="grid" id="tiles"></div>
      <p class="footer-note">Starts empty. Nothing leaves this device unless you show the QR or export a backup.</p>
    </section>
    <section id="editor" class="screen">
      <button class="back" id="backHome">← House</button>
      <h2 class="sec" id="editTitle"></h2>
      <p class="hint" id="editHint"></p>
      <div id="editBody"></div>
    </section>
  </main>
  <div class="modal" id="qrModal">
    <div class="sheet">
      <h3>Guest card</h3>
      <p class="hint">Scan shows only this card — not the full house binder.</p>
      <div class="qr-box" id="qrBox"></div>
      <pre class="card-preview" id="qrText"></pre>
      <p class="warn">Anyone who scans this can read it. Do not post the QR in public.</p>
      <div class="toolbar">
        <button class="btn btn-ghost" id="copyCard">Copy text</button>
        <button class="btn btn-qr" id="closeQr">Done</button>
      </div>
    </div>
  </div>
  <input type="file" id="fileIn" accept="application/json" hidden />
  <div class="toast" id="toast"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
